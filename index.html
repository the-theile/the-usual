    <!-- Structured data for search engines (a data block, not a script; allowed by the CSP) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "The Usual",
        "url": "https://gettheusual.bar/",
        "description": "Bartenders tell their regulars where they're working tonight, without sharing a phone number or social media.",

        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",

      }

  <body>
    <main id="app" tabindex="-1">
      <p class="loading">Pouring…</p>
      <noscript>
        <h1>The Usual</h1>

      </noscript>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
